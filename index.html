<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open AI Gen: Resilient Pipeline v5</title>
    <style>
        :root { --gold: #c5a059; --bg: #050505; --card: #121212; --text: #e0e0e0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 800px; width: 100%; }
        .card { background: var(--card); padding: 25px; border-radius: 12px; border: 1px solid #222; margin-bottom: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        h1 { color: var(--gold); text-transform: uppercase; letter-spacing: 4px; text-align: center; border-bottom: 1px solid var(--gold); padding-bottom: 15px; margin-top: 0; font-size: 22px; }
        label { color: var(--gold); font-size: 10px; font-weight: 800; text-transform: uppercase; display: block; margin-bottom: 8px; letter-spacing: 1px; }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 15px; background: #000; border: 1px solid #333; color: #fff; border-radius: 6px; font-size: 14px; }
        button { width: 100%; padding: 16px; background: var(--gold); border: none; border-radius: 6px; color: #000; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        button:disabled { background: #333; color: #666; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #fff; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(197, 160, 89, 0.3); }
        .status-box { font-size: 12px; color: #999; margin-top: 10px; padding: 12px; background: #080808; border-radius: 4px; border-left: 3px solid var(--gold); min-height: 20px; font-family: monospace; }
        #resultArea img { width: 100%; border-radius: 10px; margin-top: 25px; border: 1px solid var(--gold); box-shadow: 0 0 40px rgba(197, 160, 89, 0.1); }
        .badge { background: #222; color: #00ff88; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; margin-bottom: 10px; display: inline-block; border: 1px solid #00ff8833; }
    </style>
</head>
<body>

<div class="container">
    <h1>Cinematic Pipeline</h1>
    <div style="text-align: center;"><span class="badge">V5: FAILOVER-SYSTEM ACTIVE</span></div>

    <!-- STEP 1: INTERROGATOR -->
    <div class="card">
        <label>1. Multi-AI Aesthetic Lock</label>
        <p style="font-size: 12px; color: #666; margin-bottom: 15px;">Automated rotation between 3 Vision AI models for 100% uptime.</p>
        
        <input type="file" id="styleImage" accept="image/*">
        <input type="text" id="lockName" placeholder="Name this Framework (e.g. 'Vintage-Film')">
        
        <button id="lockBtn" onclick="runFailoverPipeline()">Analyze & Lock Style</button>
        
        <div id="status" class="status-box">System Ready.</div>
    </div>

    <!-- STEP 2: GENERATION -->
    <div class="card">
        <label>2. The Story (Subject + Action)</label>
        <select id="styleSelect"></select>
        <textarea id="userPrompt" rows="3" placeholder="Describe the scene..."></textarea>
        
        <button onclick="generateShot()">Generate Master Image</button>
        <p style="font-size: 10px; color: #555; margin-top: 10px; text-align: center;">PROTECTION: Scribble-Fixer v2 | Text-Blocker | No-Logo Guard</p>
    </div>

    <div id="resultArea"></div>
</div>

<canvas id="procCanvas" style="display:none;"></canvas>

<script>
    let savedLocks = JSON.parse(localStorage.getItem('cinematicLocksV5') || '{}');
    const VISION_MODELS = [
        "https://api-inference.huggingface.co/models/Salesforce/blip-image-captioning-large",
        "https://api-inference.huggingface.co/models/Salesforce/blip-image-captioning-base",
        "https://api-inference.huggingface.co/models/nlpconnect/vit-gpt2-image-captioning"
    ];

    updateDropdown();

    function updateDropdown() {
        const select = document.getElementById('styleSelect');
        select.innerHTML = '<option value="">Standard (No Style Lock)</option>';
        for (let name in savedLocks) {
            let opt = document.createElement('option');
            opt.value = name;
            opt.innerText = `LOCKED: ${name}`;
            select.appendChild(opt);
        }
    }

    async function preProcess(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.getElementById('procCanvas');
                    let width = img.width, height = img.height, max = 800;
                    if (width > height) { if (width > max) { height *= max / width; width = max; } }
                    else { if (height > max) { width *= max / height; height = max; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.8);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    async function uploadToCatbox(blob) {
        const formData = new FormData();
        formData.append('reqtype', 'fileupload');
        formData.append('fileToUpload', blob);
        const res = await fetch('https://corsproxy.io/?' + encodeURIComponent('https://catbox.moe/user/api.php'), {
            method: 'POST',
            body: formData
        });
        return await res.text();
    }

    async function runFailoverPipeline() {
        const file = document.getElementById('styleImage').files[0];
        const name = document.getElementById('lockName').value;
        const status = document.getElementById('status');
        const btn = document.getElementById('lockBtn');

        if (!file || !name) return alert("Upload image and name style.");

        btn.disabled = true;
        status.innerText = "> Initializing Failover Pipeline...";

        try {
            const blob = await preProcess(file);
            status.innerText = "> Optimizing & Uploading to technical host...";
            const imgUrl = await uploadToCatbox(blob);

            let caption = "";
            let success = false;

            // TRY ROTATING MODELS
            for (let i = 0; i < VISION_MODELS.length; i++) {
                status.innerText = `> Trying Vision Model ${i + 1} of ${VISION_MODELS.length}...`;
                try {
                    const res = await fetch(VISION_MODELS[i], { method: "POST", body: blob });
                    const data = await res.json();
                    if (data[0] && data[0].generated_text) {
                        caption = data[0].generated_text;
                        success = true;
                        break;
                    }
                } catch (e) { console.warn(`Model ${i} busy, skipping...`); }
            }

            if (!success) throw new Error("All Vision models are currently busy.");

            status.innerText = "> Constructing Cinematic Framework...";
            const brainPrompt = `Convert to technical Cinematic Framework: "${caption}". 
            Tags: [STYLE], [LIGHTING], [CAMERA], [TEXTURE]. 
            Focus ONLY on artistic medium. 
            Add 'Strict Constraint: No text, no letters, no numbers'. Max 25 words.`;

            const brainRes = await fetch(`https://text.pollinations.ai/${encodeURIComponent(brainPrompt)}`);
            const framework = await brainRes.text();

            savedLocks[name] = framework.replace(/["']/g, "");
            localStorage.setItem('cinematicLocksV5', JSON.stringify(savedLocks));
            
            status.innerText = `✅ Framework Locked: ${name}`;
            updateDropdown();
        } catch (e) {
            status.innerText = `❌ Error: ${e.message}. Wait 15s and retry.`;
        } finally {
            btn.disabled = false;
        }
    }

    async function generateShot() {
        const prompt = document.getElementById('userPrompt').value;
        const lockName = document.getElementById('styleSelect').value;
        const resultArea = document.getElementById('resultArea');

        if (!prompt) return alert("Enter subject!");

        resultArea.innerHTML = "<p style='text-align:center; color: #555;'>Painting master shot...</p>";

        // SCRIBBLE-FIXER v2: Stronger anti-text guardrails
        const negativeGuards = "raw film negative, high resolution photography, no text, no letters, no numbers, no watermarks, no typography, no gibberish, no signatures, no logos, no symbols, clean composition";

        let finalPrompt = "";
        if (lockName && savedLocks[lockName]) {
            finalPrompt = `[STORY]: ${prompt}. [FRAMEWORK]: ${savedLocks[lockName]}. [NEGATIVES]: ${negativeGuards}.`;
        } else {
            finalPrompt = `${prompt}. [NEGATIVES]: ${negativeGuards}.`;
        }

        const seed = Math.floor(Math.random() * 999999);
        const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(finalPrompt)}?model=flux&width=1280&height=720&nologo=true&seed=${seed}`;

        const img = new Image();
        img.src = url;
        img.onload = () => {
            resultArea.innerHTML = `<img src="${url}">`;
        };
    }
</script>

</body>
</html>
