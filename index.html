<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open AI Gen: Cinematic Master (Free Edition)</title>
    <style>
        :root { --gold: #c5a059; --bg: #0a0a0a; --card: #1a1a1a; --text: #e0e0e0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 800px; width: 100%; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #333; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: var(--gold); text-transform: uppercase; letter-spacing: 2px; text-align: center; border-bottom: 1px solid var(--gold); padding-bottom: 10px; }
        label { color: var(--gold); font-size: 10px; font-weight: 800; text-transform: uppercase; display: block; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; margin-bottom: 12px; background: #000; border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 13px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { width: 100%; padding: 14px; background: var(--gold); border: none; border-radius: 4px; color: #000; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        button:hover { background: #fff; }
        .lock-box { background: #000; padding: 12px; border: 1px dashed var(--gold); font-size: 12px; color: #aaa; margin-top: 10px; }
        #resultArea img { width: 100%; border-radius: 8px; margin-top: 20px; border: 1px solid var(--gold); }
        .cheat-sheet { font-size: 11px; color: #666; margin-top: 5px; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h1>Cinematic Master</h1>

    <!-- STEP 1: MANUAL FRAMEWORK LOCK -->
    <div class="card">
        <label>Step 1: Create a Manual Style Lock</label>
        <p style="font-size: 12px; color: #888;">Fill this out based on your reference image to "Lock" the style for free.</p>
        
        <input type="text" id="lockName" placeholder="Name this style (e.g. Noir-Film)">
        
        <div class="grid">
            <div>
                <label>Visual Style</label>
                <input type="text" id="fStyle" placeholder="e.g. 1940s Film Noir, Grainy">
            </div>
            <div>
                <label>Lighting & Color</label>
                <input type="text" id="fLight" placeholder="e.g. High contrast, blue shadows">
            </div>
            <div>
                <label>Camera/Lens</label>
                <input type="text" id="fCam" placeholder="e.g. Wide angle, 35mm, low angle">
            </div>
            <div>
                <label>Details/Texture</label>
                <input type="text" id="fDetail" placeholder="e.g. Rain droplets, metallic wear">
            </div>
        </div>
        <button onclick="saveManualLock()">Save Style Lock</button>
        <div id="saveStatus" style="font-size:12px; margin-top:10px; color: var(--gold);"></div>
    </div>

    <!-- STEP 2: GENERATOR -->
    <div class="card">
        <label>Step 2: Generate Image</label>
        <select id="styleSelect" onchange="showCurrentLock()"></select>
        <textarea id="userPrompt" rows="3" placeholder="Describe the Subject + Action (e.g. A detective standing in the rain)"></textarea>
        
        <button onclick="generateFinal()">Generate Master Shot</button>
        <div class="cheat-sheet">Fixes applied: No text, no scribbles, no extra limbs.</div>
    </div>

    <div id="resultArea"></div>
</div>

<script>
    let savedLocks = JSON.parse(localStorage.getItem('manualCinematicLocks') || '{}');
    updateDropdown();

    function updateDropdown() {
        const select = document.getElementById('styleSelect');
        select.innerHTML = '<option value="">No Style (Standard Mode)</option>';
        for (let name in savedLocks) {
            let opt = document.createElement('option');
            opt.value = name;
            opt.innerText = `STYLE: ${name}`;
            select.appendChild(opt);
        }
    }

    function saveManualLock() {
        const name = document.getElementById('lockName').value;
        const style = document.getElementById('fStyle').value;
        const light = document.getElementById('fLight').value;
        const cam = document.getElementById('fCam').value;
        const detail = document.getElementById('fDetail').value;

        if (!name) return alert("Give your style a name!");

        // Build the framework string
        const frameworkString = `Visual Style: ${style}. Lighting: ${light}. Camera: ${cam}. Details: ${detail}.`;
        
        savedLocks[name] = frameworkString;
        localStorage.setItem('manualCinematicLocks', JSON.stringify(savedLocks));
        
        document.getElementById('saveStatus').innerText = `✅ Style "${name}" saved to your browser!`;
        updateDropdown();
    }

    async function generateFinal() {
        const prompt = document.getElementById('userPrompt').value;
        const lockName = document.getElementById('styleSelect').value;
        const resultArea = document.getElementById('resultArea');

        if (!prompt) return alert("Enter a subject!");

        resultArea.innerHTML = "<p style='text-align:center; color: #666;'>AI is painting your cinematic shot...</p>";

        // The "Scribble" and "Text" Fix (The Guardrails)
        const guardrails = "clean image, no text, no watermarks, no letters, no numbers, no gibberish, no signatures, no warped objects, high quality photography";

        let finalPrompt = "";
        if (lockName && savedLocks[lockName]) {
            // Apply the Infographic Framework: Story + Framework + Guardrails
            finalPrompt = `[STORY]: ${prompt}. [FRAMEWORK]: ${savedLocks[lockName]}. [GUARDRAILS]: ${guardrails}.`;
        } else {
            finalPrompt = `${prompt}. ${guardrails}`;
        }

        const seed = Math.floor(Math.random() * 1000000);
        // Using the free image endpoint
        const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(finalPrompt)}?model=flux&width=1280&height=720&nologo=true&seed=${seed}`;

        const img = new Image();
        img.src = url;
        img.onload = () => {
            resultArea.innerHTML = `<img src="${url}">`;
        };
    }
</script>

</body>
</html>
